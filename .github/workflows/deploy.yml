name: Build and Deploy to Netlify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same ref when a new commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          # No `cache: npm` because package-lock.json is not committed; the
          # setup-node cache resolver requires a lockfile and would fail.

      - name: Install dependencies
        # `npm install` (not `npm ci`) because package-lock.json is intentionally
        # not committed for this repo.
        run: npm install

      - name: Build production bundle
        run: npm run build

      # Deploys `dist/` to Netlify. On pushes to main this becomes the live
      # production release; on pull requests it publishes a preview URL that
      # the action posts back as a PR comment.
      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v4.0.0
        with:
          publish-dir: ./dist
          production-branch: main
          production-deploy: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: Deploy from GitHub Actions
          enable-pull-request-comment: true
          enable-commit-comment: false
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 3

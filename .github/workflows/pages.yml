name: Deploy to GitHub Pages

# Manual-only trigger. Netlify already auto-deploys on every push to main;
# this workflow lets you publish an on-demand snapshot to
# https://<user>.github.io/<repo>/ without racing the Netlify pipeline.
on:
  workflow_dispatch:

# Permissions required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Serial deploys per environment — GitHub only allows one live Pages deploy
# at a time; cancel-in-progress: false so a manual re-run finishes cleanly
# rather than getting killed by a follow-up dispatch.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # configure-pages exposes the resolved base path (e.g. `/repo-name/`)
      # via `steps.pages.outputs.base_path`. We feed that into Vite so the
      # built HTML references assets under the correct sub-path automatically —
      # no hard-coded repo name here.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm install

      - name: Build production bundle
        # Vite reads VITE_BASE_PATH from vite.config.js. Using env: (not string
        # interpolation into run:) keeps the step injection-safe.
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # The URL of the live deployment is echoed back into the workflow summary.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
